name: Privileged consumer

# workflow_run: base-branch workflow, base-repository context, repository secrets available,
# GITHUB_TOKEN not forced read-only. It consumes an artifact built by an untrusted job.
on:
  workflow_run:
    workflows: [Validate]
    types:
      - completed

jobs:
  post-comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Baseline — environment before the artifact is consumed
        run: |
          echo "repo=$GITHUB_REPOSITORY ref=$GITHUB_REF event=$GITHUB_EVENT_NAME"
          echo "POC_CANARY before = '${POC_CANARY:-<unset>}'"
          echo "NODE_OPTIONS before = '${NODE_OPTIONS:-<unset>}'"

      - name: 'Download artifact'
        uses: actions/github-script@v7
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "env"
            })[0];
            let download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            let fs = require('fs');
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/env.zip`, Buffer.from(download.data));

      - name: 'Unzip artifact'
        run: |
          unzip env.zip
          ls -ltR
          while read line; do
            echo "$line" >> $GITHUB_ENV
          done < env

      - name: Proof — environment after the artifact is consumed
        run: |
          echo "POC_CANARY after = '${POC_CANARY:-<unset>}'"
          echo "NODE_OPTIONS after = '${NODE_OPTIONS:-<unset>}'"
          echo "files the fork placed in the workspace:"
          ls -la "$GITHUB_WORKSPACE"

      - name: 'Node-based action (stand-in for mshick/add-pr-comment@v2)'
        uses: actions/github-script@v7
        with:
          script: |
            core.info('github-script node process started')
            core.info('POC_CANARY visible to the Node action = ' + process.env.POC_CANARY)
            core.info('NODE_OPTIONS visible to the Node action = ' + process.env.NODE_OPTIONS)
